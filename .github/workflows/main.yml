name: Gold Matrix Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Gold Matrix
        run: python gold_matrix/main.py

      - name: Test Asset Registry
        run: python gold_matrix/test_assets.py

      - name: Test Strategy
        run: python gold_matrix/test_strategy.py

      - name: Test Settings
        run: python gold_matrix/test_settings.py

      - name: Test Rules
        run: python gold_matrix/test_rules.py

      - name: Test Scoring
        run: python gold_matrix/test_scoring.py

      - name: Test Trade Plan
        run: python gold_matrix/test_trade_plan.py

      - name: Test Risk Manager
        run: python gold_matrix/test_risk_manager.py

      - name: Test Position Sizing
        run: python gold_matrix/test_position_sizing.py

      - name: Test Trade Planner
        run: python gold_matrix/test_trade_planner.py
        
      - name: Test Multi Asset
        run: python gold_matrix/test_multi_asset.py

      - name: Test Price Utils
        run: python gold_matrix/test_price_utils.py

      - name: Test Trade Plan Validator
        run: python gold_matrix/test_trade_plan_validator.py  

      - name: Test Signal To Trade
        run: python gold_matrix/test_signal_to_trade.py 

      - name: Test ID Generator
        run: python gold_matrix/test_id_generator.py

      - name: Test Engine
        run: python gold_matrix/test_engine.py

      - name: Test Market Data
        run: python gold_matrix/test_market_data.py  

      - name: Test Market Series
        run: python gold_matrix/test_market_series.py 

      - name: Test Normalizer
        run: python gold_matrix/test_normalizer.py

      - name: Test Trend
        run: python gold_matrix/test_trend.py

      - name: Test Momentum
        run: python gold_matrix/test_momentum.py

      - name: Test Volatility
        run: python gold_matrix/test_volatility.py

      - name: Test Market Context
        run: python gold_matrix/test_market_context.py

      - name: Test Context Builder
        run: python gold_matrix/test_context_builder.py

      - name: Test Backtest Result
        run: python gold_matrix/test_backtest_result.py

      - name: Test Backtest Engine
        run: python gold_matrix/test_backtest_engine.py

        
